# =============================================================================
# nginx.conf — config principal (events + http) montada en /etc/nginx/nginx.conf
# Los virtual hosts viven en conf.d/*.conf
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    # Tipos MIME estándar
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log format con tiempo de respuesta upstream (útil para profiling)
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                      'urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # Performance
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;  # No revelar versión de nginx

    # Compresión
    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     6;
    gzip_min_length     1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # Tamaño máximo de upload (imágenes admin → 10 MB de margen)
    client_max_body_size 10M;
    client_body_timeout  30s;
    client_header_timeout 30s;

    # Limitación de conexiones (defensa básica DDoS / abuso)
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_req_zone  $binary_remote_addr zone=req_limit_per_ip:10m rate=20r/s;

    # Real IP detrás de proxies / cloudflare (ajustar si aplica)
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    include /etc/nginx/conf.d/*.conf;
}
