# =============================================================================
# ceveco.conf — virtual host de producción
#
# Flujo:
#   - Puerto 80 sirve SOLO el ACME challenge de certbot y redirige todo a 443.
#   - Puerto 443 sirve la app: estáticos directo desde disco, y todo lo demás
#     proxy hacia el contenedor app:3000.
#
# El nombre del dominio se reemplaza por la variable de entorno DOMAIN durante
# `./deploy.sh --first` (sed sobre este archivo) o se puede dejar fijo si ya
# se sabe. Por defecto: ceveco.com.co
# =============================================================================

# Cache map para estáticos según extensión.
#
# ⚠️ Los .js/.css salen con `public, immutable` a 30 días: el navegador NI
# SIQUIERA revalida. Un cambio en un .js NO le llega a quien ya lo tiene
# cacheado hasta que expire. Por eso, al modificar uno de esos archivos hay
# que subirle el `?v=AAAAMMDD` en las etiquetas <script>/<link> de las páginas
# que lo cargan (frontend/pages/*.html); el HTML sí va sin caché (default off),
# así que la URL nueva se descubre de inmediato.
map $sent_http_content_type $expires {
    default                    off;
    text/css                   30d;
    application/javascript     30d;
    ~image/                    30d;
    ~font/                     30d;
}

# -----------------------------------------------------------------------------
# HTTP — solo ACME challenge + redirect a HTTPS
# -----------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name ceveco.com.co www.ceveco.com.co;

    # ACME challenge para certbot (HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Resto: redirigir a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS — sitio principal
# -----------------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name ceveco.com.co www.ceveco.com.co;

    # Certificado (emitido por certbot; init-letsencrypt.sh crea un dummy
    # auto-firmado si todavía no existe el real, para que nginx arranque).
    ssl_certificate     /etc/letsencrypt/live/ceveco.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ceveco.com.co/privkey.pem;

    # SSL hardening (Mozilla Intermediate)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (1 año, incluir subdominios). Solo después de validar que TODO va por HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Rate-limit suave por IP en endpoints API
    limit_conn conn_limit_per_ip 20;

    # Aceptar ACME challenge también por 443 (algunas implementaciones lo intentan)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Estáticos: nginx los sirve directo desde disco.
    # -------------------------------------------------------------------------
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires $expires;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /images/productos/ {
        alias /usr/share/nginx/html/images/productos/;
        expires $expires;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri /images/productos/placeholder.webp =404;
    }

    # -------------------------------------------------------------------------
    # API y páginas HTML: proxy al contenedor app:3000
    # -------------------------------------------------------------------------
    location /api/ {
        limit_req zone=req_limit_per_ip burst=40 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Errores
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        return 503 "Servicio temporalmente no disponible. Intenta de nuevo en unos minutos.\n";
        default_type text/plain;
    }
}
