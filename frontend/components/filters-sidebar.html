<aside class="w-full lg:w-64 flex-shrink-0">
    <!-- Mobile Toggle -->
    <button id="filters-toggle-mobile" class="filters-toggle-mobile lg:hidden mb-4">
        <span class="flex items-center gap-2">
            <i data-lucide="sliders-horizontal" class="w-5 h-5"></i>
            Filtros
        </span>
        <i data-lucide="chevron-down" class="w-5 h-5"></i>
    </button>

    <!-- Filters Container -->
    <div id="filters-wrapper" class="hidden lg:block filters-sidebar">
        <!-- Header -->
        <div class="filters-header">
            <h3>
                <i data-lucide="sliders-horizontal" class="filters-header-icon"></i>
                Filtros
            </h3>
            <button class="btn-clear-filters" id="clear-filters-btn" style="display: none;">
                Limpiar
            </button>
        </div>

        <!-- Active Filters Chips -->
        <div id="active-filters-chips" class="hidden px-4 py-2 flex flex-wrap gap-1 border-b border-gray-100"></div>

        <!-- Group: Marca (checkbox list + search input + count badges) -->
        <div class="filter-group open" id="marca-filter-group">
            <button class="filter-group-header" type="button">
                <div class="filter-group-title">
                    <i data-lucide="tag" class="w-4 h-4 filter-group-icon"></i>
                    <span>Marca</span>
                </div>
                <div class="flex items-center">
                    <span class="filter-group-count-badge" id="marca-badge">0</span>
                    <i data-lucide="chevron-down" class="filter-chevron"></i>
                </div>
            </button>
            <div class="filter-group-content">
                <div class="px-4 pt-3 pb-1">
                    <input type="text" id="marca-search-input" placeholder="Buscar marca..." class="w-full text-xs border border-gray-200 rounded-md px-2 py-1.5 focus:outline-none focus:border-blue-400">
                </div>
                <div class="filter-options scrollable" id="marca-options">
                    <div class="text-xs text-gray-400 py-2 text-center">Cargando marcas...</div>
                </div>
            </div>
        </div>

        <!-- Group: Subcategoría (checkbox, only visible if category selected) -->
        <div class="filter-group open hidden" id="subcategoria-filter-group">
            <button class="filter-group-header" type="button">
                <div class="filter-group-title">
                    <i data-lucide="folder" class="w-4 h-4 filter-group-icon"></i>
                    <span>Subcategoría</span>
                </div>
                <div class="flex items-center">
                    <span class="filter-group-count-badge" id="subcategoria-badge">0</span>
                    <i data-lucide="chevron-down" class="filter-chevron"></i>
                </div>
            </button>
            <div class="filter-group-content">
                <div class="filter-options scrollable" id="subcategoria-options">
                    <!-- Rendered dynamically -->
                </div>
            </div>
        </div>

        <!-- Group: Precio -->
        <div class="filter-group open" id="price-filter-group">
            <button class="filter-group-header" type="button">
                <div class="filter-group-title">
                    <i data-lucide="dollar-sign" class="w-4 h-4 filter-group-icon"></i>
                    <span>Precio</span>
                </div>
                <div class="flex items-center">
                    <i data-lucide="chevron-down" class="filter-chevron"></i>
                </div>
            </button>
            <div class="filter-group-content">
                <div class="price-filter-container">
                    <div class="price-inputs-row">
                        <div class="price-input-wrapper">
                            <span class="price-symbol">$</span>
                            <input type="number" id="price-min" placeholder="Mín" min="0" class="price-input-field">
                        </div>
                        <span class="text-gray-400">-</span>
                        <div class="price-input-wrapper">
                            <span class="price-symbol">$</span>
                            <input type="number" id="price-max" placeholder="Máx" min="0" class="price-input-field">
                        </div>
                    </div>
                    <button id="apply-price-filter" class="btn-price-apply">
                        Aplicar
                    </button>
                </div>
            </div>
        </div>

        <!-- Group: Stock disponible -->
        <div class="filter-group" id="stock-filter-group">
            <button class="filter-group-header" type="button">
                <div class="filter-group-title">
                    <i data-lucide="package-check" class="w-4 h-4 filter-group-icon"></i>
                    <span>Disponibilidad</span>
                </div>
                <div class="flex items-center">
                    <i data-lucide="chevron-down" class="filter-chevron"></i>
                </div>
            </button>
            <div class="filter-group-content">
                <div class="filter-options">
                    <label class="filter-option" for="filter-stock">
                        <input type="checkbox" id="filter-stock" name="stock" value="1" class="filter-checkbox">
                        <span class="filter-label">Solo con stock disponible</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Group: Calificación -->
        <div class="filter-group" id="rating-filter-group">
            <button class="filter-group-header" type="button">
                <div class="filter-group-title">
                    <i data-lucide="star" class="w-4 h-4 filter-group-icon"></i>
                    <span>Calificación mínima</span>
                </div>
                <div class="flex items-center">
                    <i data-lucide="chevron-down" class="filter-chevron"></i>
                </div>
            </button>
            <div class="filter-group-content">
                <div class="filter-options">
                    <label class="filter-option" for="filter-rating-4">
                        <input type="radio" id="filter-rating-4" name="rating" value="4" class="filter-checkbox">
                        <span class="filter-label">⭐⭐⭐⭐ 4+ estrellas</span>
                    </label>
                    <label class="filter-option" for="filter-rating-3">
                        <input type="radio" id="filter-rating-3" name="rating" value="3" class="filter-checkbox">
                        <span class="filter-label">⭐⭐⭐ 3+ estrellas</span>
                    </label>
                    <label class="filter-option" for="filter-rating-2">
                        <input type="radio" id="filter-rating-2" name="rating" value="2" class="filter-checkbox">
                        <span class="filter-label">⭐⭐ 2+ estrellas</span>
                    </label>
                    <label class="filter-option" for="filter-rating-any">
                        <input type="radio" id="filter-rating-any" name="rating" value="" class="filter-checkbox" checked>
                        <span class="filter-label">Cualquier calificación</span>
                    </label>
                </div>
            </div>
        </div>
    </div>
</aside>
