version: '3.8'

services:
  # Servicio de Aplicación (Backend + Frontend)
  app:
    container_name: ceveco-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      # Conexión a BD local del host (puerto 5432)
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-ceveco_db}
      # JWT Secrets (Deberían cambiarse en producción real via .env)
      - JWT_SECRET=${JWT_SECRET:-ceveco_secret_key_prod}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ceveco-network
  # Servicio de Base de Datos PostgreSQL (COMENTADO: Usando PostgreSQL Local en puerto 5432)
  # db:
  #   image: postgres:15-alpine
  #   container_name: ceveco-db
  #   restart: always
  #   environment:
  #     POSTGRES_USER: ${DB_USER:-postgres}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
  #     POSTGRES_DB: ${DB_NAME:-ceveco_db}
  #   ports:
  #     - "5432:5432" # Expuesto para herramientas locales de admin DB (DBeaver, PGAdmin)
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #     # Script de inicialización: carga bd.sql automáticamente al crear el contenedor por primera vez
  #     - ./bd.sql:/docker-entrypoint-initdb.d/init_schema.sql
  #   healthcheck:
  #     test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ceveco_db}" ]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - ceveco-network

volumes:
  pgdata:


networks:
  ceveco-network:
    driver: bridge
